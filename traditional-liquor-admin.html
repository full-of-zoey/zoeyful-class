<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전통주 첫걸음 — 신청자 관리</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="detail">
        <header class="detail-header">
            <a href="index.html" class="back-link">← Zoeyful Class</a>
            <p class="detail-date">ADMIN</p>
            <h1 class="detail-title">전통주 첫걸음 — 신청자 관리</h1>
        </header>

        <div style="height: 10px; background: #F43F00;"></div>

        <!-- 로그인 화면 -->
        <section class="section" id="loginScreen">
            <h2 class="section-title">Login</h2>
            <p class="admin-meta">관리자 이메일로 로그인하세요.</p>
            <div class="admin-login">
                <button type="button" class="btn-submit" id="googleLoginBtn">Google로 로그인</button>
                <p class="login-error" id="loginError" hidden></p>
            </div>
        </section>

        <!-- 관리자 화면 -->
        <section class="section" id="adminPanel" hidden>
            <h2 class="section-title">Signups</h2>
            <p class="admin-meta" id="adminMeta">불러오는 중…</p>

            <div class="admin-table-wrap">
                <table class="admin-table" id="signupTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>휴대폰</th>
                            <th>자기소개·동기</th>
                            <th>신청 시각</th>
                            <th>입금</th>
                        </tr>
                    </thead>
                    <tbody id="signupTbody"></tbody>
                </table>
            </div>

            <div class="admin-actions">
                <button type="button" class="btn-submit" id="exportBtn">CSV로 내보내기</button>
                <button type="button" class="btn-submit btn-logout" id="logoutBtn">로그아웃</button>
            </div>
        </section>

        <footer class="home-footer">
            <p class="copyright">© Zoeyful Foundation</p>
            <p class="sister-site">
                <a href="https://zoeyfulfoundation.org/" target="_blank">Zoeyful Foundation →</a>
            </p>
        </footer>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 관리자로 허용된 이메일 (필요하면 더 추가)
        const ADMIN_EMAILS = [
            "zoey.hong@kakaoimpact.org",
            "honggiina@gmail.com"
        ];

        const CAPACITY = 8;
        const COLLECTION = "traditional-liquor-signups";

        const firebaseConfig = {
            apiKey: "AIzaSyBkroK82iF79Zicdk96pthEPya0SIMMAIc",
            authDomain: "zoeyful-class.firebaseapp.com",
            projectId: "zoeyful-class",
            storageBucket: "zoeyful-class.firebasestorage.app",
            messagingSenderId: "236510346953",
            appId: "1:236510346953:web:54e446cc5612c9dab0d718"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('loginScreen');
        const adminPanel = document.getElementById('adminPanel');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');
        const adminMeta = document.getElementById('adminMeta');
        const tbody = document.getElementById('signupTbody');
        const exportBtn = document.getElementById('exportBtn');

        let signups = [];
        let unsubscribe = null;

        onAuthStateChanged(auth, (user) => {
            if (user && ADMIN_EMAILS.includes(user.email)) {
                showAdmin();
            } else {
                if (user) {
                    loginError.textContent = `${user.email} 은(는) 관리자 권한이 없어요. 다른 계정으로 로그인해주세요.`;
                    loginError.hidden = false;
                    signOut(auth);
                }
                loginScreen.hidden = false;
                adminPanel.hidden = true;
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            }
        });

        googleLoginBtn.addEventListener('click', async () => {
            loginError.hidden = true;
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                loginError.textContent = '로그인에 실패했어요. (' + err.code + ')';
                loginError.hidden = false;
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        function showAdmin() {
            loginScreen.hidden = true;
            adminPanel.hidden = false;

            if (unsubscribe) unsubscribe();
            const q = query(collection(db, COLLECTION), orderBy("createdAt", "asc"));
            unsubscribe = onSnapshot(q, (snapshot) => {
                signups = [];
                snapshot.forEach((d) => {
                    signups.push({ id: d.id, ...d.data() });
                });
                render();
            }, (err) => {
                adminMeta.textContent = '데이터를 불러오지 못했어요. 보안 규칙을 확인해주세요. (' + err.code + ')';
            });
        }

        function render() {
            const paidCount = signups.filter(s => s.paid).length;
            adminMeta.innerHTML = `총 <b>${signups.length}</b>명 신청 · 입금 완료 <b>${paidCount}</b>명 · 정원 ${CAPACITY}명 (남은 자리 ${Math.max(0, CAPACITY - signups.length)})`;

            tbody.innerHTML = '';
            signups.forEach((s, idx) => {
                const tr = document.createElement('tr');
                const ts = s.createdAt && s.createdAt.toDate ? formatDate(s.createdAt.toDate()) : '-';
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${escapeHtml(s.name || '')}</td>
                    <td>${escapeHtml(s.email || '')}</td>
                    <td>${escapeHtml(s.phone || '')}</td>
                    <td class="cell-motivation">${escapeHtml(s.motivation || '')}</td>
                    <td>${ts}</td>
                    <td><input type="checkbox" data-id="${s.id}" ${s.paid ? 'checked' : ''}></td>
                `;
                tbody.appendChild(tr);
            });

            tbody.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
                cb.addEventListener('change', async (e) => {
                    const id = e.target.dataset.id;
                    await updateDoc(doc(db, COLLECTION, id), { paid: e.target.checked });
                });
            });
        }

        function formatDate(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        exportBtn.addEventListener('click', () => {
            const header = ['번호','이름','이메일','휴대폰','자기소개·동기','신청시각','입금'];
            const rows = signups.map((s, i) => [
                i + 1,
                s.name || '',
                s.email || '',
                s.phone || '',
                (s.motivation || '').replace(/\n/g, ' '),
                s.createdAt && s.createdAt.toDate ? formatDate(s.createdAt.toDate()) : '',
                s.paid ? 'O' : ''
            ]);
            const csv = [header, ...rows]
                .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))
                .join('\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `traditional-liquor-signups-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
